name: Diagnose Kiro Signin Page

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install playwright only (no proxy)
        env:
          HTTPS_PROXY: ''
          HTTP_PROXY: ''
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Diagnose direct (no proxy)
        run: |
          rm -f accounts.db
          python diagnose.py 2>&1