name: Check Proxy Egress IP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install curl_cffi (no proxy)
        env:
          HTTPS_PROXY: ''
          HTTP_PROXY: ''
        run: pip install curl_cffi
      - name: Check egress
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python proxy_check.py 2>&1