name: Camoufox PoC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Camoufox (no proxy)
        env:
          HTTPS_PROXY: ''
          HTTP_PROXY: ''
        run: |
          pip install "camoufox[geoip]>=0.5.4,<0.6"
          python -m camoufox fetch
          # Firefox runtime deps (same as grok2 Dockerfile)
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            xvfb \
            libasound2t64 libatk1.0-0t64 libavcodec60 libcairo-gobject2 \
            libcairo2 libdbus-1-3 libfontconfig1 libfreetype6 \
            libgdk-pixbuf-2.0-0 libglib2.0-0t64 libgtk-3-0t64 \
            libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libx11-xcb1 \
            libxcb-shm0 libxcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxtst6 \
            fonts-liberation fonts-noto-color-emoji

      - name: Run PoC
        run: |
          python camoufox_poc.py 2>&1