name: Register Kiro Accounts (CF Email Worker + CapSolver)

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of accounts to register'
        required: false
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (no proxy)
        env:
          HTTPS_PROXY: ''
          HTTP_PROXY: ''
        run: |
          pip install -r requirements.txt
          python -m camoufox fetch
          # Firefox runtime deps (Camoufox is Firefox-core) + xvfb
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            xvfb \
            libasound2t64 libatk1.0-0t64 libavcodec60 libcairo-gobject2 \
            libcairo2 libdbus-1-3 libfontconfig1 libfreetype6 \
            libgdk-pixbuf-2.0-0 libglib2.0-0t64 libgtk-3-0t64 \
            libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libx11-xcb1 \
            libxcb-shm0 libxcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxtst6 \
            fonts-liberation fonts-noto-color-emoji

      - name: Register accounts
        env:
          MAIL_PROVIDER: cf_worker
          CF_EMAIL_API_BASE: ${{ secrets.CF_EMAIL_API_BASE }}
          CF_EMAIL_DOMAIN: ${{ secrets.CF_EMAIL_DOMAIN }}
          CF_EMAIL_PREFIX: ${{ secrets.CF_EMAIL_PREFIX }}
          CAPTCHA_PROVIDER: capsolver
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PYTHONUNBUFFERED: '1'
          DISPLAY: ':99'
        run: |
          # Camoufox (Firefox-core) 反检测 + xvfb 有头 + humanize 鼠标 + 住宅代理
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          sleep 2
          python service.py --batch ${{ inputs.count }} --delay 10 --provider cf_worker --no-headless 2>&1

      - name: Show result
        if: always()
        run: |
          echo "=== accounts.db summary ==="
          python - <<'PY'
          import sqlite3, os
          db = os.environ.get("DB_PATH", "accounts.db")
          if os.path.exists(db):
              conn = sqlite3.connect(db)
              cur = conn.execute("SELECT email, incomplete, fail_reason FROM service_accounts ORDER BY id DESC LIMIT 20")
              for row in cur.fetchall():
                  print(row)
              conn.close()
          else:
              print("no accounts.db generated")
          PY